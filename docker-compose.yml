---
services:
  stormwatch:
    build: .
    ports:
      - "${HOST_PORT:-80}:${NGINX_PORT:-8080}"
    volumes:
      # PNG frames, persisted across restarts
      - ./frames:/app/frames
    env_file:
      # Optional — see .env.example. Real env vars (below) take precedence.
      - path: .env
        required: false
    environment:
      - MF_RADAR_API_KEY
      - MF_AROMEPI_API_KEY
      - MF_PACKAGE_OBS_API_KEY
      - MF_PIAF_API_KEY
      - MF_VIGILANCE_KEY
      - FETCH_INTERVAL_SEC
      - MAX_FRAMES
      - MAX_FRAME_AGE_MIN
      - FRAMES_DIR
      - HOST
      - PORT
      - BLITZORTUNG_MQTT_HOST
      - BLITZORTUNG_MQTT_PORT
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NGINX_PORT:-8080}/health"]
      interval: 60s
      timeout: 5s
      retries: 3
