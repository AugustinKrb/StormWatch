[project]
name = "stormwatch-radar"
version = "0.1.2"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "flask>=3.1",
    "gunicorn>=26.1.0",
    "h5py>=3.13",
    "numpy>=2.5.2",
    "pyproj>=3.7",
    "pillow>=11.2",
    "requests>=2.32",
    "apscheduler>=3.11",
    "python-dotenv>=1.2.3",
    "paho-mqtt>=2.0",
    "rasterio>=1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pylint>=4.0.7",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (tri des imports)
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pylint.main]
py-version = "3.12"
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
# aromepi.py and converter.py are data-heavy but not complex — raised from defaults (15/6)
max-locals = 25
max-returns = 8
# wcs.fetch_frames() genuinely needs each of its 7 params — raised from the default 5.
max-args = 7
max-positional-arguments = 7
