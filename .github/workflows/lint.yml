---
name: Lint

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550  # v5.2.2

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Install JS toolchain
        run: npm ci

      - name: Install Python toolchain
        run: uv sync --frozen

      - name: Run pre-commit (ruff, eslint, stylelint, hadolint, gitleaks...)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
