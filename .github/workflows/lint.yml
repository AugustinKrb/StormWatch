---
name: Lint

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install JS toolchain
        run: npm ci

      - name: Install Python toolchain
        run: uv sync --frozen

      - name: Run pre-commit (ruff, eslint, stylelint, hadolint, gitleaks...)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
