---
name: Lint

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0

      - name: Install JS toolchain
        run: npm ci

      - name: Install Python toolchain
        run: uv sync --frozen

      - name: Run pre-commit (ruff, eslint, stylelint, hadolint, gitleaks...)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
