---
name: Lint

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install JS toolchain
        run: npm ci

      - name: Install Python toolchain
        run: uv sync --frozen

      - name: Run pre-commit (ruff, eslint, stylelint, hadolint, gitleaks...)
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
