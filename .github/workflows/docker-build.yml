---
name: Docker build

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Build (local only, just to scan it — never pushed from a PR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          push: false
          load: true
          tags: stormwatch:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image scan findings as a readable table (always, never fails the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: "true"
        with:
          image-ref: stormwatch:pr-check
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Export image scan findings as JSON for the PR comment
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: stormwatch:pr-check
          format: json
          output: trivy-image.json
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Build a markdown table from the JSON findings
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/trivy_to_markdown.py trivy-image.json "Trivy — image scan" > trivy-image-comment.md

      - name: Post/update the scan results as a PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: trivy-image-scan
          path: trivy-image-comment.md

      - name: Scan the built image — catches a broken release build before it's tagged
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: stormwatch:pr-check
          format: sarif
          output: trivy-results-image.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: "true"
          exit-code: "1"

      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results-image.sarif
