[supervisord]
logfile=/dev/stdout
logfile_maxbytes=0

[program:nginx]
command=/bin/sh -c "envsubst '${PORT} ${NGINX_PORT}' < /etc/nginx/nginx.conf.template > /etc/nginx/sites-enabled/default && exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:radar]
command=gunicorn --bind 127.0.0.1:%(ENV_PORT)s --workers 1 --threads 4 --timeout 60 main:app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
