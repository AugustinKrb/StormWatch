repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: uv run --frozen pylint
        language: system
        types: [python]
        files: ^src/

  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise exec -- npx markdownlint-cli2
        language: system
        files: \.md$
        exclude: ^CHANGELOG\.md$

      - id: eslint
        name: eslint
        entry: mise exec -- npx eslint
        language: system
        files: ^js/.*\.js$

      - id: stylelint
        name: stylelint
        entry: mise exec -- npx stylelint
        language: system
        files: ^css/.*\.css$

      - id: htmlhint
        name: htmlhint
        entry: mise exec -- npx htmlhint
        language: system
        files: \.html$

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.14.0
    hooks:
      - id: hadolint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
